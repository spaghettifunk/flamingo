# flamingo configuration
debug = false

[keybindings]
new_file = "ctrl+n"
open_file = "ctrl+o"
open_folder = "ctrl+f"
settings = "ctrl+p"
quit = "ctrl+q"

toggle_explorer = "ctrl+b"
toggle_terminal = "ctrl+t"
switch_focus = "ctrl+e"
close_tab = "ctrl+w"
next_tab = "alt+]"
previous_tab = "alt+["
jump_back = "alt+o"
jump_forward = "alt+p"

dashboard_up = "up"
dashboard_down = "down"
dashboard_select = "enter"

explorer_up = "up"
explorer_down = "down"
explorer_open = "enter"

insert_mode = "i"
command_mode = ":"
search_mode = "/"
normal_mode = "esc"

insert_newline = "enter"
delete_back = "backspace"
delete_word_back = "alt+delete"
indent = "tab"

prompt_submit = "enter"
prompt_backspace = "backspace"

save = "ctrl+s"
undo = "ctrl+z"
redo = "ctrl+y"
select_all = "ctrl+a"
copy = "ctrl+c"
cut = "ctrl+x"
paste = "ctrl+v"
duplicate_line = "ctrl+d"
delete_line = "ctrl+shift+k"
add_cursor_above = "ctrl+alt+up"
add_cursor_below = "ctrl+alt+down"

move_up = "up"
move_down = "down"
move_left = "left"
move_right = "right"
line_start = "alt+down"
line_end = "alt+up"
word_left = "alt+left"
word_right = "alt+right"

search_next = "down"
search_previous = "up"

completion_auto_trigger = "."
completion_trigger = "ctrl+space"
completion_next = "down"
completion_previous = "up"
completion_accept = "enter"
completion_cancel = "esc"

# Preferred keybinding schema. These tables map key sequences to canonical
# command names from src/editor/commands.zig. The flat [keybindings] fields
# above remain supported for one migration window.
#
# [keybindings.normal]
# "gg" = "navigation.goto_file_start"
# "G" = "navigation.goto_file_end"
# "ctrl+s" = "file.write"
#
# [keybindings.insert]
# "esc" = "mode.normal"
# "ctrl+s" = "file.write"
#
# [keybindings.command_line]
# "enter" = "command.execute"
# "tab" = "command.suggestion_next"
# "esc" = "command.cancel"
#
# [keybindings.search]
# "enter" = "search.accept"
# "esc" = "search.cancel"
# "down" = "search.next_match"
# "up" = "search.previous_match"
#
# [keybindings.terminal]
# "esc" = "terminal.unfocus"
# "pageup" = "terminal.scroll_page_up"
# "pagedown" = "terminal.scroll_page_down"
#
# [keybindings.normal.unbind]
# keys = ["ctrl+q", "ctrl+w"]
#
# The :help popup reflects resolved defaults, overrides, and unbinds. The
# command popup uses command metadata for command names, aliases, and
# descriptions.
#
# Printable editor text, prompt text, and terminal PTY input are raw input,
# not command keybindings.

[explorer]
width_percentage = 20
