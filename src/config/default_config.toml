# flamingo configuration
debug = false

[ui]
# auto uses a conservative fallback: unicode when UTF-8 locale is detected,
# ascii otherwise. Use nerd_font only after configuring your terminal font.
icon_mode = "auto"

# Keybindings use context-specific tables that map key sequences to canonical
# command names from src/editor/commands.zig.
#
# [keybindings.normal]
# "gg" = "navigation.goto_file_start"
# "G" = "navigation.goto_file_end"
# "ctrl+s" = "file.write"
#
# [keybindings.insert]
# "esc" = "mode.normal"
# "ctrl+s" = "file.write"
#
# [keybindings.command_line]
# "enter" = "command.execute"
# "tab" = "command.suggestion_next"
# "esc" = "command.cancel"
#
# [keybindings.search]
# "enter" = "search.accept"
# "esc" = "search.cancel"
# "down" = "search.next_match"
# "up" = "search.previous_match"
#
# [keybindings.terminal]
# "esc" = "terminal.unfocus"
# "pageup" = "terminal.scroll_page_up"
# "pagedown" = "terminal.scroll_page_down"
#
# [keybindings.normal.unbind]
# keys = ["ctrl+q", "ctrl+w"]
#
# The :help popup reflects resolved defaults, overrides, and unbinds. The
# command popup uses command metadata for command names, aliases, and
# descriptions.
#
# Printable editor text, prompt text, and terminal PTY input are raw input,
# not command keybindings.

[explorer]
width_percentage = 20

[agent]
# Provider options: "mock" or "openai".
provider = "mock"

[agent.openai]
# API keys are read from the environment only; never put secrets in config.
api_key_env = "OPENAI_API_KEY"
model = "gpt-5-codex"

[agent.limits]
max_file_reads = 50
max_search_results = 100
max_tool_calls = 100
max_file_read_bytes = 262144
max_context_files = 8
max_context_file_bytes = 32768
max_context_total_bytes = 262144

[agent.policy]
require_approval_for_validation = false
require_approval_for_patch_apply = true

[agent.policy.paths]
deny = [".git", "zig-out", ".zig-cache", "node_modules", "target", "dist", "build"]

[agent.validation]
commands = [
  "zig build test",
  "zig build",
]

# Built-in language server defaults can be overridden per language.
# Protobuf defaults to Buf's LSP:
#
# [languages.protobuf]
# extensions = ["proto"]
#
# [languages.protobuf.lsp]
# command = "buf"
# args = ["lsp", "serve"]
# language_id = "proto"
